# Repo-wide tool configuration (shared by all Python parts: collector, backend, ml)

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["collector/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
